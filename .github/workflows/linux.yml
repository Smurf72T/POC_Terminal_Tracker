name: CI (Linux)

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: Build and test (Ubuntu)
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Qt 6 (apt)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libqt6sql6-psql
          sudo apt-get install -y qt6-charts-dev || sudo apt-get install -y libqt6charts6-dev
          test -f /usr/lib/x86_64-linux-gnu/cmake/Qt6/Qt6Config.cmake
          echo "QT_PLUGIN_PATH=/usr/lib/x86_64-linux-gnu/qt6/plugins" >> "$GITHUB_ENV"

      - name: Install PostgreSQL client + server
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev postgresql postgresql-contrib

      - name: Configure
        run: cmake -S . -B build -DCMAKE_PREFIX_PATH=/usr/lib/x86_64-linux-gnu/cmake -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release -j "$(nproc)"

      - name: Start PostgreSQL
        run: |
          sudo pg_ctlcluster $(ls /etc/postgresql | head -n1) main start
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          pg_isready -h localhost -p 5432

      - name: Test (incl. DB integration + concurrency)
        env:
          POC_DB_HOST: localhost
          POC_DB_PORT: '5432'
          POC_DB_USER: postgres
          POC_DB_PASSWORD: postgres
        run: |
          export QT_QPA_PLATFORM=offscreen
          ctest --test-dir build -C Release --output-on-failure

  coverage:
    name: Code coverage (gcovr)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Qt 6 (apt)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libqt6sql6-psql
          sudo apt-get install -y qt6-charts-dev || sudo apt-get install -y libqt6charts6-dev
          test -f /usr/lib/x86_64-linux-gnu/cmake/Qt6/Qt6Config.cmake
          echo "QT_PLUGIN_PATH=/usr/lib/x86_64-linux-gnu/qt6/plugins" >> "$GITHUB_ENV"

      - name: Install build deps + gcovr
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev
          python3 -m pip install --user gcovr

      - name: Configure (coverage flags)
        run: cmake -S . -B build -DCMAKE_PREFIX_PATH=/usr/lib/x86_64-linux-gnu/cmake -DBUILD_TESTS=ON \
          -DCMAKE_CXX_FLAGS="--coverage -O0" -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build
        run: cmake --build build --config Release -j "$(nproc)"

      - name: Run unit tests
        run: |
          export QT_QPA_PLATFORM=offscreen
          ctest --test-dir build -C Release \
            -R "test_password_utils|test_validator|test_update_utils|test_updatemanager|test_opsscheduler|test_connectionpool|test_circuitbreaker" \
            --output-on-failure

      - name: Generate coverage report (gcovr)
        run: |
          gcovr --root . \
            --filter "src/" \
            --exclude "src/main.cpp" \
            --exclude ".*autogen.*" \
            --exclude "libs/" \
            --xml-pretty -o coverage.xml \
            --html --html-details -o coverage.html

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage.*
          if-no-files-found: error

      - name: Upload to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
