name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-package:
    name: Build, test and package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Qt 6.11.1 (MSVC) + qtcharts
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtcharts'
          # В релизе aqtinstall (PyPI 3.3.0, 2025-06) нет поддержки Qt 6.11 —
          # новая структура репозитория Qt. Фикс только на master (PR #1000).
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e'
          cache: true

      - name: Install PostgreSQL 17
        shell: powershell
        run: |
          choco install postgresql17 -y --no-progress --params '/Password:postgres'
          if ($LASTEXITCODE -ne 0) {
            Start-Sleep -Seconds 10
            choco install postgresql17 -y --no-progress --params '/Password:postgres'
            if ($LASTEXITCODE -ne 0) { throw "choco install postgresql17 failed" }
          }
          $pgBin = "C:\Program Files\PostgreSQL\17\bin"
          if (-not (Test-Path "$pgBin\psql.exe")) { throw "PostgreSQL binaries not found at $pgBin" }
          for ($i = 0; $i -lt 30; $i++) {
            & "$pgBin\pg_isready.exe" -h localhost -p 5432 -U postgres
            if ($LASTEXITCODE -le 1) { break }
            Start-Sleep -Seconds 2
          }
          & "$pgBin\psql.exe" -h localhost -p 5432 -U postgres -c "SELECT version();"

      - name: Install NSIS (for CPack installer)
        shell: powershell
        run: |
          choco install nsis -y --no-progress
          $nsisExe = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $nsisExe)) { throw "NSIS not found at $nsisExe" }

      - name: Configure
        shell: powershell
        run: |
          if (-not $env:QT_ROOT_DIR) { throw "QT_ROOT_DIR is not set" }
          $env:PATH = "C:\Program Files (x86)\NSIS;" + $env:PATH
          cmake -S . -B build `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" `
            "-DPostgreSQL_ROOT=C:\Program Files\PostgreSQL\17" `
            -DBUILD_TESTS=ON

      - name: Build
        shell: powershell
        run: cmake --build build --config Release

      - name: Test (incl. DB integration + concurrency)
        shell: powershell
        env:
          POC_DB_HOST: localhost
          POC_DB_PORT: '5432'
          POC_DB_USER: postgres
          POC_DB_PASSWORD: postgres
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Deploy portable distribution
        shell: powershell
        run: cmake --build build --config Release --target deploy

      - name: Sign (if code-signing certificate provided)
        shell: powershell
        env:
          CODE_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          CODE_SIGN_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:CODE_SIGN_PFX_BASE64)) {
            Write-Host "CODE_SIGN_PFX_BASE64 не задан — подпись пропущена"
          } else {
            $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CODE_SIGN_PFX_BASE64))
            $securePass = ConvertTo-SecureString $env:CODE_SIGN_PASSWORD -AsPlainText -Force
            Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePass | Out-Null
            $cert = Get-ChildItem Cert:\CurrentUser\My |
              Where-Object { $_.HasPrivateKey -and $_.NotAfter -gt (Get-Date) } |
              Sort-Object NotAfter -Descending | Select-Object -First 1
            if (-not $cert) { throw "No valid code-signing certificate found in store" }
            $exe = "build\deploy\POC_Terminal_Tracker.exe"
            if (-not (Test-Path $exe)) { throw "deploy exe not found: $exe" }
            Set-AuthenticodeSignature -FilePath $exe -Certificate $cert | Out-Null
            $sig = Get-AuthenticodeSignature $exe
            Write-Host "Signature status: $($sig.Status)"
            if ($sig.Status -ne 'Valid') { throw "Signature verification failed: $($sig.Status)" }
          }

      - name: Package ZIP + NSIS installer
        shell: powershell
        run: |
          cpack -C Release --config build/CPackConfig.cmake
          Get-ChildItem POC_Terminal_Tracker-*.zip, POC_Terminal_Tracker-*.exe |
            ForEach-Object { Write-Host $_.Name }

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v5
        with:
          name: POC_Terminal_Tracker-portable
          path: POC_Terminal_Tracker-*.zip
          if-no-files-found: error

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v5
        with:
          name: POC_Terminal_Tracker-installer
          path: POC_Terminal_Tracker-*.exe
          if-no-files-found: error

      - name: Generate SHA256 checksums
        shell: powershell
        run: |
          Get-ChildItem POC_Terminal_Tracker-*.zip, POC_Terminal_Tracker-*.exe | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "{0}  {1}" -f $hash.Hash, $_.Name | Out-File -Encoding ascii "$($_.Name).sha256"
          }
          Get-ChildItem POC_Terminal_Tracker-*.sha256 | ForEach-Object { Write-Host $_.Name }

      - name: Upload SHA256 checksums
        uses: actions/upload-artifact@v5
        with:
          name: POC_Terminal_Tracker-checksums
          path: POC_Terminal_Tracker-*.sha256
          if-no-files-found: error
